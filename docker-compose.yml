# Pile mviewer + GeoServer
#   mviewer   : http://localhost:8095/?config=apps/perso/zan_rouen.xml
#   GeoServer : http://localhost:8096/geoserver/web/   (identifiants dans .env)
#   PostGIS   : PostgreSQL de la machine hôte, joint depuis GeoServer via host.docker.internal:5432
name: mviewer

services:
  mviewer:
    image: mviewer/mviewer:v4.2
    container_name: mviewer
    ports:
      - "127.0.0.1:8095:8080"
    volumes:
      # Tes applications (fichiers XML) : D:\mviewer\apps -> apps/perso/ dans mviewer
      - ./apps:/usr/share/nginx/html/apps/perso:ro
    restart: unless-stopped

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.6
    container_name: mviewer-geoserver
    ports:
      - "127.0.0.1:8096:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      # Autorise mviewer (autre port = autre origine) à interroger GeoServer
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:8095,http://127.0.0.1:8095"
      EXTRA_JAVA_OPTS: "-Xms256m -Xmx1g"
    extra_hosts:
      # Docker Desktop (Windows/macOS) le fournit déjà ; nécessaire sous Linux
      - "host.docker.internal:host-gateway"
    volumes:
      - geoserver_data:/opt/geoserver_data
      # Polices Windows utilisées par les styles QGIS (Segoe UI), chargées au démarrage
      - ./fonts:/opt/additional_fonts:ro
    restart: unless-stopped

volumes:
  geoserver_data:
